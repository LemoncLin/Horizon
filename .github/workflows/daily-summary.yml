name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 20 * * *'
  workflow_dispatch:      # Allow manual trigger
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - email-test

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Create dummy subscribers.json for email-test
        if: ${{ github.event.inputs.mode == 'email-test' }}
        run: |
          mkdir -p data
          if [ ! -f data/subscribers.json ]; then
            echo '["lin1796646806@163.com"]' > data/subscribers.json
            echo "Created data/subscribers.json with default test address"
          else
            echo "data/subscribers.json already exists: $(cat data/subscribers.json)"
          fi

      - name: Run Horizon (full mode)
        if: ${{ github.event.inputs.mode != 'email-test' }}
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run horizon --hours 24

      - name: Run email diagnostic test
        if: ${{ github.event.inputs.mode == 'email-test' }}
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run horizon --email-test

      - name: Set current date as environment variable
        if: ${{ github.event.inputs.mode != 'email-test' }}
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.mode != 'email-test' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
